<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Leave Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/static/css/style.css">
    
    
  </head>
  <body>
    <div class="container">
      <h1>
        Voice Leave Application
      </h1>
      
      <h1>
        
        
        <i class="fa-solid fa-microphone" id="start-voice"
        class="mic-icon"></i>

        <i class="fa-solid fa-headset" id="listening-icon"
        class="listening-icon"></i>
       
      </h1>
      <div class="main-container">
        <div class="left-container">
          <div>
            <label><strong>Leave Type:</strong></label>
            <input
              type="text"
              id="leave-type"
              class="output"
              placeholder="Leave Type"
              readonly
            />
          </div>
          <br>
          <div>
            <label><strong>From Date (YYYY-MM-DD):</strong></label>
            <input
              type="text"
              id="from-date-combined"
              class="output"
              placeholder="From Date"
              readonly
            />
          </div>
          <br>
          <div>
            <label><strong>To Date (YYYY-MM-DD):</strong></label>
            <input
              type="text"
              id="to-date-combined"
              class="output"
              placeholder="To Date"
              readonly
            />
          </div>
          <div class="btn-container">
          <button id="reset">Reset</button>
          <button id="submit-leave">Submit Leave</button>
          </div>
          <div id="response" class="response"></div>
        </div>
        <div class="right-container">
          <img src="/static/images/Trilog.png" class="logo" alt="Invincix-HERO">
        </div>
      </div>
      </div>
    <script src="/static/js/script.js">
   </script>
  </body>
</html>
